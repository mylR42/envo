# Inclus par le vhost /etc/nginx/sites-available/envo. Réécrit à chaque installation
# (@RACINE@ et @PORT@ remplacés par install-vps.sh).
#
# La racine ne contient QUE le site compilé (releases/<commit>/www) : ni .git, ni
# configuration, ni secret. C'est ce qui rend `try_files $uri` sûr ici — à
# l'inverse de bluetti, où il servirait config/config.php en clair.
#
# ⚠️ Un tour de l'assistante répond EN FLUX (SSE) et peut durer plusieurs minutes
# (plusieurs appels à Claude et à Interfast) : pas de mise en tampon, délai long.

root @RACINE@/current/www;
index index.html;

# L'API : le serveur Node n'écoute que sur 127.0.0.1.
location /api/ {
    include snippets/envo-entetes.conf;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ~ ^/api/conversations/[^/]+/turn$ {
    include snippets/envo-entetes.conf;
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
}

# Fichiers à nom haché (Vite) : ils ne changent jamais, cache d'un an.
location /assets/ {
    include snippets/envo-entetes.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Le reste (index.html, manifest, icône) : toujours revalidé, sinon un iPhone
# garde l'ancienne version et ne voit jamais la nouvelle.
location / {
    include snippets/envo-entetes.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

location ~ /\. { deny all; }

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
