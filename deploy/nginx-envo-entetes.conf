# En-têtes de sécurité. Dans un fichier à part parce que nginx n'hérite PAS des
# add_header du niveau supérieur dès qu'un location en déclare un : il faut les
# répéter dans chaque location, donc les inclure.
#
# CSP : tout vient du site lui-même ; style 'unsafe-inline' aux attributs style de React.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
# HTTPS imposé pour un an (ignoré tant que le site est servi en http, avant certbot).
add_header Strict-Transport-Security "max-age=31536000" always;
# Pas d'affichage dans un cadre d'un autre site (doublon de frame-ancestors pour les vieux navigateurs).
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
