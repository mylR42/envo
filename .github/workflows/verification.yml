# Vérifie chaque push et chaque PR : types (navigateur ET serveur), tests, compilation.
# Le déploiement automatique (branche `dist` tirée par le VPS, comme Pixo) viendra avec la mise en production.
name: Vérification

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}
